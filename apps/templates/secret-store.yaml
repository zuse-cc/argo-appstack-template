apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.stack.name }}-secret-store
  namespace: argocd
spec:
  project: {{ .Values.stack.name }}
  source:
    repoURL: '{{ .Values.source.repoURL }}'
    targetRevision: '{{ .Values.source.targetRevision }}'
    path: manifests/secret-store
    helm:
      valuesObject:
        stack:
          name: '{{ .Values.stack.name }}'
        backend: '{{ .Values.backend }}'
        infisical:
          endpoint: '{{ .Values.infisical.endpoint }}'
          projectSlug: '{{ .Values.infisical.projectSlug }}'
          environment: '{{ .Values.infisical.environment }}'
          secretsPath: '{{ .Values.infisical.secretsPath }}'
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-secrets
  syncPolicy:
    {{- if .Values.autosync.enabled }}
    automated:
      prune: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
