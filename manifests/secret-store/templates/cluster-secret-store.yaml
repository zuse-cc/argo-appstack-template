{{- if eq .Values.backend "infisical" }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.stack.name }}
spec:
  provider:
    infisical:
      hostAPI: {{ .Values.infisical.endpoint }}
      auth:
        universalAuthCredentials:
          clientId:
            name: universal-auth-credentials
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: universal-auth-credentials
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: {{ .Values.infisical.projectSlug }}
        environmentSlug: {{ .Values.infisical.environment }}
        secretsPath: {{ .Values.infisical.secretsPath }}
{{- else if eq .Values.backend "kubernetes" }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.stack.name }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.localSecrets.namespace }}
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-system
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ .Values.stack.name }}-local-reader
          namespace: external-secrets
{{- end }}
