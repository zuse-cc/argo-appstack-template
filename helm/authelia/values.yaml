## Authelia Helm values - minimal PoC/test configuration
## Chart: authelia/authelia from https://charts.authelia.com
##
## Before deploying, update:
##   - session.cookies[].domain and authelia_url to match your cluster domain
##   - ingress host / TLS settings

# domain: your-cluster.example.com

pod:
  replicas: 1
  kind: Deployment

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: cluster-issuer
  tls:
    enabled: true
    secret: authelia-tls

## Reference a pre-created Kubernetes secret containing:
##   JWT_TOKEN, SESSION_ENCRYPTION_KEY, STORAGE_ENCRYPTION_KEY
# secret:
#   existingSecret: authelia-secrets

configMap:
  theme: light
  log:
    level: info

  authentication_backend:
    password_reset:
      disable: true
    file:
      enabled: true
      path: /config/users_database.yml
      password:
        algorithm: argon2
        argon2:
          variant: argon2id
          iterations: 3
          memory: 65536
          parallelism: 4
          key_length: 32
          salt_length: 16

  session:
    name: authelia_session
    same_site: lax
    inactivity: 5m
    expiration: 1h
    remember_me: 1d
    cookies:
      - domain: your-cluster.example.com  # update to match your cluster domain
        subdomain: auth
        authelia_url: https://auth.your-cluster.example.com
        default_redirection_url: https://your-cluster.example.com

  storage:
    local:
      enabled: true
      path: /config/db.sqlite3

  notifier:
    disable_startup_check: false
    filesystem:
      enabled: true
      filename: /tmp/notification.txt

  access_control:
    default_policy: one_factor

persistence:
  enabled: true
  size: 100Mi

pod:
  extraVolumes:
    - name: users
      configMap:
        name: authelia-users
  extraVolumeMounts:
    - name: users
      mountPath: /config/users_database.yml
      subPath: users_database.yml
