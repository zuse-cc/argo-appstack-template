name: Publish Helm charts

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  # Space-separated list of chart directories under charts/. Update if you rename charts.
  CHARTS: appstack-apps appstack-secrets

jobs:
  publish-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}

      - name: Derive chart version
        id: chart_version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Use first chart to read the base version — all charts share the same version
            FIRST_CHART=$(echo "${{ env.CHARTS }}" | awk '{print $1}')
            BASE=$(grep '^version:' charts/${FIRST_CHART}/Chart.yaml | awk '{print $2}')
            SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
            echo "version=${BASE}-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push charts
        run: |
          for chart in ${{ env.CHARTS }}; do
            helm package charts/${chart} \
              --version ${{ steps.chart_version.outputs.version }}
            helm push ${chart}-${{ steps.chart_version.outputs.version }}.tgz \
              oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm
          done
